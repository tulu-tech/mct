<svg class="illu" viewBox="0 0 460 360" role="img" aria-labelledby="i13-t i13-d" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="i13-t">Showroom verification criteria</title>
  <desc id="i13-d">A checklist clipboard overlapping a simple line storefront, with three pine-green ticks marking the criteria used to describe showrooms and one open dashed box marking the limits of verification.</desc>

  <!-- ===== STOREFRONT GLYPH (behind, upper-right) ===== -->
  <g aria-hidden="true">
    <!-- shopfront body fill -->
    <rect class="if-s" x="251" y="74" width="156" height="118" rx="3"/>
    <!-- awning fill -->
    <path class="if-p" d="M247 74 L411 74 L405 56 L253 56 Z"/>
    <!-- shop outline -->
    <rect class="il-ln" x="251" y="74" width="156" height="118" rx="3" fill="none"/>
    <!-- awning -->
    <path class="il-ln" d="M249 74 L409 74 L403 55 L255 55 Z" fill="none"/>
    <!-- awning scallop hints -->
    <path class="il-d" d="M275 74 L281 60 M305 74 L311 60 M335 74 L341 60 M365 74 L371 60" />
    <!-- door -->
    <rect class="if-w" x="340" y="120" width="46" height="72"/>
    <rect class="il-ln" x="340" y="120" width="46" height="72" fill="none"/>
    <line class="il-d" x1="376" y1="156" x2="376" y2="160"/>
    <!-- window -->
    <rect class="if-w" x="271" y="120" width="50" height="46"/>
    <rect class="il-ln" x="271" y="120" width="50" height="46" fill="none"/>
    <line class="il-d" x1="296" y1="120" x2="296" y2="166"/>
    <line class="il-d" x1="271" y1="143" x2="321" y2="143"/>
  </g>

  <!-- ===== CLIPBOARD / CHECKLIST CARD (front, lower-left, overlapping) ===== -->
  <!-- card shadow-offset tint under lines -->
  <rect class="if-w" x="42" y="118" width="214" height="206" rx="6"/>
  <!-- clip -->
  <rect class="if-t" x="123" y="98" width="52" height="26" rx="4"/>
  <rect class="il-ln" x="123" y="98" width="52" height="26" rx="4" fill="none"/>
  <rect class="il-d" x="136" y="92" width="26" height="14" rx="6" fill="none"/>
  <!-- board outline (drawn) -->
  <rect class="il-ln flow" pathLength="1" x="42" y="118" width="214" height="206" rx="6" fill="none"/>

  <!-- header rule + title line on card -->
  <line class="il-d" x1="64" y1="150" x2="234" y2="150"/>

  <!-- ===== CHECKLIST ROWS ===== -->
  <!-- Row 1 -->
  <g class="cp" style="--i:1">
    <rect class="if-p" x="64" y="166" width="22" height="22" rx="3"/>
    <rect class="il-ln" x="64" y="166" width="22" height="22" rx="3" fill="none"/>
    <path class="il-p flow" pathLength="1" d="M69 177 L74 182 L82 171" fill="none"/>
    <line class="il-d" x1="98" y1="172" x2="216" y2="172"/>
    <line class="il-d" x1="98" y1="182" x2="178" y2="182"/>
  </g>
  <!-- Row 2 -->
  <g class="cp" style="--i:2">
    <rect class="if-p" x="64" y="206" width="22" height="22" rx="3"/>
    <rect class="il-ln" x="64" y="206" width="22" height="22" rx="3" fill="none"/>
    <path class="il-p flow" pathLength="1" d="M69 217 L74 222 L82 211" fill="none"/>
    <line class="il-d" x1="98" y1="212" x2="216" y2="212"/>
    <line class="il-d" x1="98" y1="222" x2="170" y2="222"/>
  </g>
  <!-- Row 3 -->
  <g class="cp" style="--i:3">
    <rect class="if-p" x="64" y="246" width="22" height="22" rx="3"/>
    <rect class="il-ln" x="64" y="246" width="22" height="22" rx="3" fill="none"/>
    <path class="il-p flow" pathLength="1" d="M69 257 L74 262 L82 251" fill="none"/>
    <line class="il-d" x1="98" y1="252" x2="216" y2="252"/>
    <line class="il-d" x1="98" y1="262" x2="188" y2="262"/>
  </g>
  <!-- Row 4 — the LIMIT: open, unchecked, dashed -->
  <g class="cp" style="--i:4">
    <rect class="if-a" x="64" y="286" width="22" height="22" rx="3"/>
    <rect class="il-ln il-dash" x="64" y="286" width="22" height="22" rx="3" fill="none"/>
    <line class="il-dash il-d" x1="98" y1="297" x2="200" y2="297"/>
    <text class="il-sm" x="98" y="313">BEYOND VERIFICATION</text>
  </g>

  <!-- ===== MONO TAG ===== -->
  <g class="cp" style="--i:0">
    <rect class="if-s" x="291" y="222" width="104" height="30" rx="4"/>
    <rect class="il-ln" x="291" y="222" width="104" height="30" rx="4" fill="none"/>
    <circle class="in-p" cx="307" cy="237" r="4"/>
    <text class="il-sm" x="319" y="241">CRITERIA</text>
  </g>

  <!-- connector from tag to checklist -->
  <path class="il-d il-dash" d="M291 237 C272 237 262 220 256 208" fill="none"/>
</svg>
