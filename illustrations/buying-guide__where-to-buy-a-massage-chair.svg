<svg class="illu" viewBox="0 0 460 360" role="img" aria-labelledby="wtb-t wtb-d" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="wtb-t">Three ways to buy, one set of checks</title>
  <desc id="wtb-d">A browser-window glyph labelled Online, a storefront-door glyph labelled Showroom, and a shipping-box glyph labelled Marketplace all connect down to a single clipboard glyph tagged Same Checks, showing every channel meets the same verification.</desc>

  <!-- ===== ONLINE: browser window (left) ===== -->
  <g transform="translate(28,46)">
    <rect class="if-w" x="2" y="2" width="112" height="84" rx="7"/>
    <rect class="il-ln" x="0" y="0" width="112" height="84" rx="7" fill="none" pathLength="1"/>
    <rect class="if-p" x="0" y="0" width="112" height="22" rx="7"/>
    <path class="il-d" d="M0 22 H112" fill="none"/>
    <circle class="in-t" cx="14" cy="11" r="3"/>
    <circle class="in-p" cx="25" cy="11" r="3"/>
    <rect class="if-s" x="44" y="6" width="60" height="10" rx="5"/>
    <path class="il-d" d="M16 42 H96 M16 56 H80 M16 70 H90" fill="none"/>
  </g>
  <g class="cp" style="--i:1">
    <text class="il-lbl" x="86" y="152" text-anchor="middle">Online</text>
    <text class="il-sm" x="86" y="166" text-anchor="middle">AUTHORIZED</text>
  </g>

  <!-- ===== SHOWROOM: storefront door (center) ===== -->
  <g transform="translate(178,40)">
    <path class="if-t" d="M-2 26 L52 4 L106 26 Z"/>
    <path class="il-ln" d="M-2 26 L52 4 L106 26" fill="none" stroke-linejoin="round" pathLength="1"/>
    <rect class="if-s" x="6" y="26" width="92" height="64"/>
    <rect class="il-ln" x="6" y="26" width="92" height="64" fill="none" pathLength="1"/>
    <rect class="if-w" x="38" y="42" width="28" height="48"/>
    <path class="il-p" d="M38 90 V42 H66 V90" fill="none" stroke-linejoin="round"/>
    <path class="il-d" d="M38 60 H66" fill="none"/>
    <circle class="in-t" cx="61" cy="70" r="2.4"/>
    <rect class="if-p" x="14" y="44" width="18" height="26"/>
    <rect class="if-p" x="72" y="44" width="18" height="26"/>
  </g>
  <g class="cp" style="--i:2">
    <text class="il-lbl" x="230" y="152" text-anchor="middle">Showroom</text>
    <text class="il-sm" x="230" y="166" text-anchor="middle">TRY IN PERSON</text>
  </g>

  <!-- ===== MARKETPLACE: shipping box (right) ===== -->
  <g transform="translate(330,48)">
    <path class="if-s" d="M6 30 L52 12 L98 30 L52 48 Z"/>
    <path class="il-ln" d="M6 30 L52 12 L98 30 L52 48 Z" fill="none" stroke-linejoin="round" pathLength="1"/>
    <path class="if-w" d="M6 30 L52 48 L52 90 L6 72 Z"/>
    <path class="il-ln" d="M6 30 L52 48 L52 90 L6 72 Z" fill="none" stroke-linejoin="round" pathLength="1"/>
    <path class="if-p" d="M52 48 L98 30 L98 72 L52 90 Z"/>
    <path class="il-ln" d="M52 48 L98 30 L98 72 L52 90 Z" fill="none" stroke-linejoin="round" pathLength="1"/>
    <path class="il-d" d="M52 12 L52 48 M28 21 L74 39" fill="none"/>
  </g>
  <g class="cp" style="--i:3">
    <text class="il-lbl" x="382" y="152" text-anchor="middle">Marketplace</text>
    <text class="il-sm" x="382" y="166" text-anchor="middle">VERIFY FIRST</text>
  </g>

  <!-- ===== connectors converging down ===== -->
  <path class="il-ln flow" d="M86 176 L86 202 Q86 216 100 216 L360 216 Q374 216 374 202 L374 176" fill="none" pathLength="1"/>
  <path class="il-ln flow" d="M230 176 L230 216" fill="none" pathLength="1"/>
  <path class="il-p flow" d="M230 216 L230 240" fill="none" pathLength="1"/>

  <!-- ===== clipboard: same checks ===== -->
  <g transform="translate(190,244)">
    <rect class="if-w" x="2" y="6" width="80" height="70" rx="6"/>
    <rect class="il-ln" x="0" y="4" width="80" height="70" rx="6" fill="none" pathLength="1"/>
    <rect class="if-p" x="28" y="-2" width="24" height="14" rx="4"/>
    <path class="il-p" d="M14 26 l6 6 l12 -14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="il-d" d="M40 24 H68" fill="none"/>
    <path class="il-p" d="M14 44 l6 6 l12 -14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="il-d" d="M40 42 H68" fill="none"/>
    <path class="il-p" d="M14 62 l6 6 l12 -14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="il-d" d="M40 60 H62" fill="none"/>
  </g>
  <g class="cp" style="--i:4">
    <text class="il-ttl" x="230" y="338" text-anchor="middle">Same checks</text>
  </g>
</svg>
